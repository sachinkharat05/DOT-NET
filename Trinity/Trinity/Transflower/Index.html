<!DOCTYPE html>

<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Management System</title>
    <style>

        body{
            font-family:Arial,Helvetica,sans-serif;
            background-color:#f4f4f4;
            margin:20px;
        }

        h1{
            text-align:center;
            color:navy;
        }

        .container{
            display:flex;
            gap:20px;
            justify-content:center;
            margin-top:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0px 0px 10px lightgray;
            width:350px;
        }

        h2{
            text-align:center;
            color:darkblue;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:10px;
        }

        input,select{
            width:100%;
            padding:8px;
            margin-top:5px;
        }

        button{
            margin-top:15px;
            padding:10px;
            width:100%;
            background:royalblue;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:darkblue;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        table,th,td{
            border:1px solid gray;
        }

        th{
            background:steelblue;
            color:white;
            padding:8px;
        }

        td{
            padding:8px;
            text-align:center;
        }

    </style>

</head>

<body>

<h1>Training Management System</h1>

<div class="container">

    <!-- Courses -->

    <div class="card">

        <h2>Courses</h2>

        <label>Course Name</label>
        <input type="text" placeholder="Enter Course">

        <button>Add Course</button>

        <table>

            <tr>
                <th>Id</th>
                <th>Course</th>
            </tr>

            <tr>
                <td>23</td>
                <td>TAP</td>
            </tr>

            <tr>
                <td>24</td>
                <td>CDAC</td>
            </tr>

        </table>

    </div>

    <!-- Students -->

    <div class="card">

        <h2>Students</h2>

        <label>Student Name</label>
        <input type="text" placeholder="Enter Student Name">

        <button>Add Student</button>

        <table>

            <tr>
                <th>Id</th>
                <th>Name</th>
            </tr>

            <tr>
                <td>34</td>
                <td>Santhosh</td>
            </tr>

            <tr>
                <td>44</td>
                <td>Rajesh</td>
            </tr>

            <tr>
                <td>65</td>
                <td>Harshal</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Seeta</td>
            </tr>

        </table>

    </div>

</div>

<br>

<div class="card" style="width:80%;margin:auto;">

    <h2>Student Course Enrollment</h2>

    <label>Select Course</label>

    <select>
        <option>TAP</option>
        <option>CDAC</option>
    </select>

    <label>Select Student</label>

    <select>
        <option>Santhosh</option>
        <option>Rajesh</option>
        <option>Harshal</option>
        <option>Seeta</option>
    </select>

    <button>Enroll Student</button>

    <table>

        <tr>
            <th>Enrollment Id</th>
            <th>Course</th>
            <th>Student</th>
        </tr>

        <tr>
            <td>1</td>
            <td>TAP</td>
            <td>Santhosh</td>
        </tr>

        <tr>
            <td>2</td>
            <td>TAP</td>
            <td>Rajesh</td>
        </tr>

        <tr>
            <td>3</td>
            <td>CDAC</td>
            <td>Seeta</td>
        </tr>

        <tr>
            <td>4</td>
            <td>TAP</td>
            <td>Seeta</td>
        </tr>

    </table>

</div>

</body>
</html>
